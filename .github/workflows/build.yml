# Tests, then builds the installable apps and the web (iPad / iPhone) version.
#   Windows .exe installer, macOS .dmg (Intel + Apple Silicon), Linux AppImage, Android .apk, iPad .ipa (unsigned), web zip.
#
# Branches (see CLAUDE.md): dev = new features and fixes, prerelease = clean-up, master = the latest release.
# - Every push and pull request runs the tests (release checks, unit tests, smoke test); pushes to prerelease and
#   master and pull requests also run the full browser suite (tools/e2e).
# - A push to master whose package.json version has no release yet publishes the GitHub Release v<version>, with the
#   CHANGELOG.md notes of that version, and the website. Releases only come from master.
# - "[build]" in the FIRST LINE of a commit message on any branch makes a test build (downloads under the workflow run).
# - By hand (Actions > Build apps > Run workflow): a test build, or "fix_notes" to write the changelog into every
#   existing release.
name: Build apps
on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, prerelease]
  workflow_dispatch:
    inputs:
      fix_notes:
        description: Write the CHANGELOG.md notes into every existing GitHub Release
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.g.outputs.build }}
      release: ${{ steps.g.outputs.release }}
      e2e: ${{ steps.g.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        env:
          MSG: ${{ github.event.head_commit.message }}
          EV: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FIX: ${{ inputs.fix_notes }}
        run: |
          subject="$(printf '%s' "$MSG" | head -n1)"
          ver=$(node -p "require('./package.json').version")
          build=false; release=false; e2e=false
          if [[ "$subject" == *"[build]"* ]]; then build=true; fi
          if [ "$EV" = workflow_dispatch ] && [ "$FIX" != true ]; then build=true; fi
          # a new version on master = a release (the tag is made by the release job)
          if [ "$EV" = push ] && [ "$REF" = refs/heads/master ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then release=true; build=true; fi
          if [ "$EV" = pull_request ] || [ "$REF" = refs/heads/master ] || [ "$REF" = refs/heads/prerelease ] || [ "$release" = true ]; then e2e=true; fi
          echo "version $ver: build=$build release=$release e2e=$e2e"
          echo "build=$build" >> "$GITHUB_OUTPUT"; echo "release=$release" >> "$GITHUB_OUTPUT"; echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
  test:
    # nothing is built or released unless the tests pass
    needs: gate
    if: github.event_name != 'workflow_dispatch' || inputs.fix_notes != true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_PATH: /tmp/pw/node_modules
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install the test tools (Playwright with Chromium, for Node and Python)
        run: |
          npm install --prefix /tmp/pw --no-audit --no-fund playwright@1.63.0
          npx --prefix /tmp/pw playwright install --with-deps chromium
          pip install -q playwright==1.63.0
          python -m playwright install chromium
      - name: Release checks, unit tests, smoke test (npm test)
        run: |
          cp app.js /tmp/app.committed.js
          python3 build.py
          git diff --quiet -- app.js || { echo "::error::app.js is not up to date with parts/: run python3 build.py and commit app.js"; exit 1; }
          python3 tools/tests/test_release.py
          node tools/tests/unit.cjs
          python3 tools/smoke.py
      - name: Tools for the browser suite's test files
        if: needs.gate.outputs.e2e == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg imagemagick
          pip install -q Pillow==12.3.0 psd-tools==1.26.1   # the versions the tests are written against
      - name: Full browser suite (tools/e2e)
        if: needs.gate.outputs.e2e == 'true'
        run: bash tools/e2e/run_all.sh /tmp/sf-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: test-screenshots, path: /tmp/sf-e2e/*.png, if-no-files-found: ignore }
  notes:
    # by hand: every existing release gets the notes of its version from CHANGELOG.md
    if: github.event_name == 'workflow_dispatch' && inputs.fix_notes == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            v=${tag#v}
            if python3 tools/release_notes.py "$v" > notes.md 2>/dev/null; then gh release edit "$tag" --notes-file notes.md && echo "notes written: $tag"; else echo "no changelog section for $tag"; fi
          done
  desktop:
    needs: [gate, test]
    if: needs.gate.outputs.build == 'true' && needs.test.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          # macOS: macos-15-intel is the macOS machine this account gets; it builds both Intel and Apple Silicon .dmg
          - os: macos-15-intel
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
  android:
    needs: [gate, test]
    if: needs.gate.outputs.build == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
      - name: Create the Android project
        run: |
          command -v convert >/dev/null || command -v magick >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          node tools/build_www.mjs
          npx cap add android
          bash tools/android_icons.sh
          VER=$(node -p "require('./package.json').version")
          sed -i "s/versionName \".*\"/versionName \"$VER\"/; s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          npx cap sync android
      - name: Sign with the Sketchforge key (so a new APK installs over the old one, keeping drawings and settings)
        env:
          KS1: ${{ secrets.ANDROID_KEYSTORE }}
          KS2: ${{ secrets.ANDROID_KEYSTORE_2 }}
        run: |
          KS="$KS1$KS2" # the key in one or two parts (phones copy at most 2000 characters at once)
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > android/app/sketchforge.keystore
            CLEAN=$(printf '%s' "$KS" | tr -d ' \r\n'); echo "Secret: ${#CLEAN} characters (expected 3536), key file: $(wc -c < android/app/sketchforge.keystore) bytes (expected 2650)"
            if ! keytool -list -keystore android/app/sketchforge.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              echo "::error::The ANDROID_KEYSTORE secret is not the Sketchforge key (cut off or changed when pasted). Put part 1 in secret ANDROID_KEYSTORE and part 2 in secret ANDROID_KEYSTORE_2 (Settings > Secrets and variables > Actions)."; exit 1
            fi
            # sign debug builds with this key explicitly (Gradle's default ~/.android/debug.keystore is not reliable on CI)
            cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  debug {
                      storeFile file('sketchforge.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE
            echo "SF_SIGNED=1" >> "$GITHUB_ENV"
            echo "Using the Sketchforge signing key"
          else
            echo "::warning::Secret ANDROID_KEYSTORE is not set: this APK gets a random key and cannot be installed over a previous version"
          fi
      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Check the signing certificate
        run: |
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          CERT=$("$AS" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256" | head -1 | awk '{print $NF}')
          echo "APK certificate SHA-256: $CERT"
          WANT=46de89643bbc415f6a04eea7c44223056e4f3c1522f98f648203bdc5deca10f8
          if [ "$SF_SIGNED" = 1 ] && [ "$CERT" != "$WANT" ]; then echo "::error::The APK is not signed with the Sketchforge key"; exit 1; fi
      - name: Name the APK
        run: |
          VER=$(node -p "require('./package.json').version")
          mkdir -p out && cp android/app/build/outputs/apk/debug/app-debug.apk out/Sketchforge-$VER-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: out/*.apk, if-no-files-found: error }
  ios:
    # iPad / iPhone app: an UNSIGNED .ipa (no Apple Developer account yet), installed with a sideloading tool
    # (AltStore / Sideloadly with your Apple ID; it works 7 days, then install again). Needs a macOS machine:
    # it runs on its own and adds the .ipa to the release when it is done, so a busy macOS queue never holds the
    # other downloads or the website back.
    needs: [gate, test]
    if: needs.gate.outputs.build == 'true' && needs.test.result == 'success'
    # macos-15-intel is the macOS machine this account gets (macos-14 / 15 / 13 / latest: "not supported" or never start)
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Create the iOS project
        run: |
          node tools/build_www.mjs
          npx cap add ios
          VER=$(node -p "require('./package.json').version")
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" $PL
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" $PL
          # saved files show in the Files app (On My iPad › Sketchforge); every orientation; Pencil-friendly full screen
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" $PL || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" $PL || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" $PL || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" $PL || true
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset
          for f in "$ICON"/*.png; do sips -z 1024 1024 icon-512.png --out "$f" >/dev/null; done
          npx cap sync ios
      - name: Build the app (unsigned)
        run: |
          VER=$(node -p "require('./package.json').version")
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -20
          mkdir -p Payload ../../out && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../out/Sketchforge-$VER-ios-unsigned.ipa Payload
          ls -la ../../out
      - uses: actions/upload-artifact@v4
        with: { name: ios-ipa, path: out/*.ipa, if-no-files-found: error }
      - name: Add the .ipa to the release
        if: needs.gate.outputs.release == 'true'
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          V=v$(node -p "require('./package.json').version")
          for i in $(seq 1 60); do gh release view "$V" >/dev/null 2>&1 && break; sleep 30; done
          gh release upload "$V" out/*.ipa --clobber
  web:
    needs: [gate, test]
    if: needs.gate.outputs.build == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/build_www.mjs
      - name: Zip the web version
        run: |
          VER=$(node -p "require('./package.json').version")
          mkdir -p out && (cd www && zip -qr ../out/Sketchforge-$VER-web.zip .)
      - uses: actions/upload-artifact@v4
        with: { name: web-zip, path: out/*.zip }
      - name: Build the website (site + web app + version.json)
        run: node tools/build_site.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist-site }
  pages:
    # The official website on GitHub Pages (https://<owner>.github.io/<repo>/): the landing page, the web app for
    # browsers / iPad (/app/) and version.json, which every installed app checks for updates. Published on releases.
    # does not wait for the installers (a missing macOS machine must not hold the website back)
    needs: [gate, web]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/configure-pages@v5
        with: { enablement: true }
        continue-on-error: true
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Tell search engines about the new pages (IndexNow; the key file is public, in site/)
        continue-on-error: true
        env: { INDEXNOW_KEY: f6536befdc21418698b7bdb9f506433d }
        run: |
          B="${{ steps.deploy.outputs.page_url }}"; B="${B%/}"; H="${B#https://}"; H="${H%%/*}"
          sleep 30
          curl -sS -m 30 -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"$H\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"$B/$INDEXNOW_KEY.txt\",\"urlList\":[\"$B/\",\"$B/app/\",\"$B/community.html\",\"$B/shared.html\"]}" -w ' HTTP %{http_code}\n'
  release:
    needs: [gate, desktop, android, web]
    # a desktop build that could not run (e.g. no macOS machine free) does not block the release
    if: always() && needs.gate.outputs.release == 'true' && needs.web.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    env:
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          echo "v=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "repo=$(node -p "(require('./package.json').sketchforge || {}).releasesRepo || ''")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: Release notes from CHANGELOG.md
        run: python3 tools/release_notes.py > notes.md && cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Sketchforge ${{ steps.ver.outputs.v }}
          tag_name: ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            files/*.exe
            files/*.dmg
            files/*.AppImage
            files/*.apk
            files/*.zip
          body_path: notes.md
      # Public downloads (the website links here, so people can download without access to this private repository).
      # Needs package.json "sketchforge.releasesRepo" (an empty public repository) and the secret RELEASES_TOKEN
      # (a fine-grained token with Contents: read and write on that repository). See docs/ONLINE-SETUP.md.
      - if: steps.ver.outputs.repo != '' && env.HAS_RELEASES_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ steps.ver.outputs.repo }}
          token: ${{ secrets.RELEASES_TOKEN }}
          name: Sketchforge ${{ steps.ver.outputs.v }}
          tag_name: ${{ steps.ver.outputs.v }}
          make_latest: true
          files: |
            files/*.exe
            files/*.dmg
            files/*.AppImage
            files/*.apk
          body_path: notes.md
