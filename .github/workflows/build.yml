# Builds the installable apps and the web (iPad / iPhone) version.
#   Windows .exe installer, macOS .dmg (Intel + Apple Silicon), Linux AppImage, Android .apk, web zip.
# Starts when the FIRST LINE of a pushed commit message contains [build] (test build: downloads under the workflow
# run) or [release] (also publishes a GitHub Release v<package.json version>), on v* tags, or by hand
# (Actions → Build apps → Run workflow, tick "release" to publish).
name: Build apps
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release with the downloads
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  gate:
    # reads only the first line of the commit message, so "[release]" written in a description does not publish
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.g.outputs.build }}
      release: ${{ steps.g.outputs.release }}
    steps:
      - id: g
        env:
          MSG: ${{ github.event.head_commit.message }}
          EV: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REL: ${{ inputs.release }}
        run: |
          subject="$(printf '%s' "$MSG" | head -n1)"
          build=false; release=false
          if [ "$EV" != push ] || [[ "$REF" == refs/tags/* ]] || [[ "$subject" == *"[build]"* ]] || [[ "$subject" == *"[release]"* ]]; then build=true; fi
          if [[ "$REF" == refs/tags/v* ]] || [ "$REL" = true ] || [[ "$subject" == *"[release]"* ]]; then release=true; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"; echo "release=$release" >> "$GITHUB_OUTPUT"
  desktop:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          # macOS: paused (no macOS machines were free on GitHub); to build the Mac app again, put back:
          #   - os: macos-latest
          #     target: --mac
          # and set "sketchforge.mac": true in package.json (website download links)
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
  android:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
      - name: Create the Android project
        run: |
          command -v convert >/dev/null || command -v magick >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          node tools/build_www.mjs
          npx cap add android
          bash tools/android_icons.sh
          VER=$(node -p "require('./package.json').version")
          sed -i "s/versionName \".*\"/versionName \"$VER\"/; s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          npx cap sync android
      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: |
          VER=$(node -p "require('./package.json').version")
          mkdir -p out && cp android/app/build/outputs/apk/debug/app-debug.apk out/Sketchforge-$VER-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: out/*.apk, if-no-files-found: error }
  web:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/build_www.mjs
      - name: Zip the web version
        run: |
          VER=$(node -p "require('./package.json').version")
          mkdir -p out && (cd www && zip -qr ../out/Sketchforge-$VER-web.zip .)
      - uses: actions/upload-artifact@v4
        with: { name: web-zip, path: out/*.zip }
      - name: Build the website (site + web app + version.json)
        run: node tools/build_site.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist-site }
  pages:
    # The official website on GitHub Pages (https://<owner>.github.io/<repo>/): the landing page, the web app for
    # browsers / iPad (/app/) and version.json, which every installed app checks for updates. Published on releases.
    # does not wait for the installers (a missing macOS machine must not hold the website back)
    needs: [gate, web]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/configure-pages@v5
        with: { enablement: true }
        continue-on-error: true
      - id: deploy
        uses: actions/deploy-pages@v4
  release:
    needs: [gate, desktop, android, web]
    # a desktop build that could not run (e.g. no macOS machine free) does not block the release
    if: always() && needs.gate.outputs.release == 'true' && needs.web.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    env:
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          echo "v=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "repo=$(node -p "(require('./package.json').sketchforge || {}).releasesRepo || ''")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          name: Sketchforge ${{ steps.ver.outputs.v }}
          tag_name: ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            files/*.exe
            files/*.dmg
            files/*.AppImage
            files/*.apk
            files/*.zip
          body: |
            **Windows**: download `Sketchforge-Setup-….exe` and run it (Windows may say "unknown publisher": More info → Run anyway).
            **Mac**: `…-mac-arm64.dmg` for Apple Silicon (M1/M2/M3…), `…-mac-x64.dmg` for Intel. Open the dmg, drag Sketchforge to Applications, then right-click → Open the first time (the app is not notarised).
            **Android**: download the `.apk` on the phone / tablet and open it (allow "install unknown apps" when asked).
            **Linux**: the `.AppImage` (make it executable, then run it).
            **iPad / iPhone**: open the web link in Safari → Share → Add to Home Screen.
      # Public downloads (the website links here, so people can download without access to this private repository).
      # Needs package.json "sketchforge.releasesRepo" (an empty public repository) and the secret RELEASES_TOKEN
      # (a fine-grained token with Contents: read and write on that repository). See docs/ONLINE-SETUP.md.
      - if: steps.ver.outputs.repo != '' && env.HAS_RELEASES_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ steps.ver.outputs.repo }}
          token: ${{ secrets.RELEASES_TOKEN }}
          name: Sketchforge ${{ steps.ver.outputs.v }}
          tag_name: ${{ steps.ver.outputs.v }}
          make_latest: true
          files: |
            files/*.exe
            files/*.dmg
            files/*.AppImage
            files/*.apk
          body: Sketchforge ${{ steps.ver.outputs.v }}. Install instructions on the Sketchforge website.
