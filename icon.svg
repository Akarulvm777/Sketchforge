<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Inkvessa Draw</title>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22e4ff"/>
      <stop offset="0.5" stop-color="#7d8cff"/>
      <stop offset="1" stop-color="#ff3fd8"/>
    </linearGradient>
    <linearGradient id="neonD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f86ff"/>
      <stop offset="1" stop-color="#ff3fd8"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#1a1b2b"/>
      <stop offset="1" stop-color="#0c0d16"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)"/>
  <rect x="22" y="22" width="468" height="468" rx="92" fill="none" stroke="#1f5560" stroke-opacity=".7" stroke-width="3"/>

  <!-- the big "I" drawn as a pen -->
  <g filter="url(#glow)">
    <!-- top serif = pen cap end -->
    <rect x="128" y="88" width="152" height="40" rx="18" fill="url(#neon)"/>
    <!-- barrel -->
    <rect x="170" y="118" width="68" height="214" rx="14" fill="url(#neon)"/>
    <!-- grip band -->
    <rect x="160" y="318" width="88" height="26" rx="10" fill="url(#neon)"/>
    <!-- nib -->
    <path d="M168 344 L240 344 L214 414 Q204 438 194 414 Z" fill="url(#neon)"/>
  </g>
  <!-- details on the pen (dark lines so it reads as a pen) -->
  <rect x="200" y="140" width="8" height="150" rx="4" fill="#0c0d16" fill-opacity=".35"/>
  <path d="M204 352 L204 404" stroke="#0c0d16" stroke-width="5" stroke-linecap="round" stroke-opacity=".6"/>
  <circle cx="204" cy="372" r="6" fill="#0c0d16" fill-opacity=".6"/>
  <!-- ink dot under the nib -->
  <circle cx="204" cy="446" r="9" fill="#ff3fd8" filter="url(#glow)"/>

  <!-- the small cute cartoon "D" -->
  <g transform="rotate(8 362 340)">
    <path d="M300 262 L344 262 Q420 262 420 340 Q420 418 344 418 L300 418 Q286 418 286 404 L286 276 Q286 262 300 262 Z" fill="url(#neonD)" filter="url(#glow)"/>
    <!-- eyes -->
    <ellipse cx="333" cy="322" rx="12" ry="16" fill="#0c0d16"/>
    <ellipse cx="373" cy="322" rx="12" ry="16" fill="#0c0d16"/>
    <circle cx="337" cy="316" r="5" fill="#fff"/>
    <circle cx="377" cy="316" r="5" fill="#fff"/>
    <!-- smile -->
    <path d="M334 360 Q353 380 372 360" fill="none" stroke="#0c0d16" stroke-width="7" stroke-linecap="round"/>
    <!-- blush -->
    <ellipse cx="318" cy="352" rx="9" ry="5" fill="#ffd1f4" fill-opacity=".7"/>
    <ellipse cx="390" cy="352" rx="9" ry="5" fill="#ffd1f4" fill-opacity=".7"/>
  </g>
</svg>
