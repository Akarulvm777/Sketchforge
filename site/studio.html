<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio — Inkvessa</title>
<meta name="description" content="Inkvessa studio: draw and animate right in your browser.">
<meta name="theme-color" content="#05070d">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --bar: 46px; --line: #1b2740; --muted: #8a9bbd; --text: #e6efff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05070d; color: var(--text); font: 15px/1.4 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  .bar { position: fixed; top: 0; left: 0; right: 0; height: calc(var(--bar) + env(safe-area-inset-top)); padding: env(safe-area-inset-top) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
    display: flex; align-items: center; gap: 6px; background: rgba(5, 7, 13, .92); border-bottom: 1px solid rgba(46, 168, 255, .22); backdrop-filter: blur(12px); z-index: 5; transition: transform .25s; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; margin-right: 6px; white-space: nowrap; }
  .brand img { width: 26px; height: 26px; border-radius: 7px; }
  .brand small { font-weight: 600; color: #4cc3ff; padding: 2px 8px; border-radius: 999px; background: rgba(46, 168, 255, .14); border: 1px solid rgba(46, 168, 255, .3); font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; }
  .links { display: flex; gap: 2px; margin-left: auto; }
  .links a, .ic { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: 8px; color: var(--muted); font-weight: 500; font-size: .9rem; border: 0; background: none; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .links a:hover, .ic:hover { color: #fff; background: rgba(46, 168, 255, .12); }
  .ic { padding: 0 9px; font-size: 1rem; }
  .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  .frame { position: fixed; left: 0; right: 0; bottom: 0; top: calc(var(--bar) + env(safe-area-inset-top)); transition: top .25s; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #05070d; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 16px; color: var(--muted); }
  .loading i { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--line); border-top-color: #4cc3ff; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tab { position: fixed; top: env(safe-area-inset-top); left: 50%; transform: translate(-50%, -110%); z-index: 6; padding: 4px 14px 6px; border-radius: 0 0 12px 12px; border: 1px solid rgba(46, 168, 255, .35); border-top: 0;
    background: rgba(5, 7, 13, .9); color: var(--muted); font: 600 .8rem inherit; cursor: pointer; transition: transform .25s; }
  .tab:hover { color: #fff; }
  body.min .bar { transform: translateY(-100%); }
  body.min .frame { top: 0; }
  body.min .tab { transform: translate(-50%, 0); }
  @media (max-width: 720px) { .links a span, .hide-sm { display: none; } .brand small { display: none; } .links a { padding: 0 9px; } }
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="./" title="Back to the website"><img src="icon-192.png" alt="">Inkvessa <small>Studio</small></a>
  <nav class="links">
    <a href="./" title="Website">🏠 <span>Website</span></a>
    <a href="shared.html" title="Shared art &amp; tools">🖼 <span>Shared</span></a>
    <a href="community.html" title="Community" class="hide-sm">💬 <span>Community</span></a>
    <a href="account.html" title="Account">👤 <span>Account</span></a>
    <a href="./#download" title="Download the app" class="hide-sm">⬇ <span>Download</span></a>
  </nav>
  <span class="sep"></span>
  <button class="ic" id="fs" title="Full screen">⤢</button>
  <button class="ic" id="min" title="Hide this bar">⌃</button>
</header>
<button class="tab" id="show" title="Show the bar">⌄ Inkvessa</button>

<main class="frame">
  <div class="loading" id="loading"><i></i>Loading the studio…</div>
  <iframe id="app" src="app/" title="Inkvessa" allow="fullscreen; clipboard-read; clipboard-write; autoplay" allowfullscreen></iframe>
</main>

<script>
  const app = document.getElementById('app'), body = document.body;
  app.addEventListener('load', () => { document.getElementById('loading').remove(); try { app.contentWindow.focus(); } catch (e) {} });
  const setMin = m => { body.classList.toggle('min', m); try { localStorage.setItem('sf_studio_min', m ? '1' : '0'); } catch (e) {} };
  document.getElementById('min').onclick = () => setMin(true);
  document.getElementById('show').onclick = () => setMin(false);
  try { if (localStorage.getItem('sf_studio_min') === '1') body.classList.add('min'); } catch (e) {}
  const fs = document.getElementById('fs');
  if (!document.fullscreenEnabled) fs.hidden = true;
  fs.onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
  document.addEventListener('fullscreenchange', () => { fs.textContent = document.fullscreenElement ? '⤡' : '⤢'; });
</script>
</body>
</html>
